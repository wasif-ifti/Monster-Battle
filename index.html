<!doctype html>
<html lang="en">
<head>
  <script src="./mini-coi.js" scope="./"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster Battle</title>
  <meta property="og:title" content="Monster Battle by Wasif Islam">
  <meta property="og:description" content="A turn-based battle game in Python. Fight a Goblin, a Troll, and a Dragon.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@pyscript/core@0.7.31/dist/core.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@pyscript/core@0.7.31/dist/core.js"></script>
  <style>
    body { margin: 0; padding: 24px 16px; background: #0f1115; color: #e6e6e6;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 16px; color: #a8adb7; line-height: 1.5; }
    a { color: #7cb7ff; }
    .loading { color: #a8adb7; font-style: italic; }
    .term { border: 1px solid #2a2f3a; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>
  <main>
    <h1>⚔️ Monster Battle</h1>
    <p>A turn-based battle game in Python. Fight a Goblin, a Troll, and a Dragon. Click inside the terminal below and type your moves.</p>
    <p class="loading" id="loading">Loading Python in your browser (first load takes a few seconds)...</p>
    <div class="term">
      <script type="py" terminal worker config="./pyscript.json">
from pyscript import document
document.getElementById("loading").remove()
import main
main.main()
      </script>
    </div>
    <p style="margin-top:16px">Made by Wasif Islam &middot; <a href="https://github.com/wasif-ifti/Monster-Battle">View the code on GitHub</a></p>
  </main>
</body>
</html>
